<!doctype html>
<html>
  <style>
    .icon {
      position: relative;
      height: 4em;
    }
    hr {
      flex-basis: 100%;
      height: 0;
      margin: 0;
      border: 0;
    }
    .vidDiv {
      position: relative;
      height: 100%;
      width: 100%;
      margin: auto;
      text-align: center;
    }
    .inset {
      border-style: double;
      border-width: medium;
      border-top-color: #fafafa;
      border-left-color: #f4f4f4;
      border-bottom-color: #333333;
      border-right-color: #333333;
      margin: 0.5em;
      padding: 0.5em;
    }
    html,
    body {
      height: 100%;
      margin: 1px;
      background-color: #f0f0f0;
      color: #303030;
      font-family: Copperplate;
    }
    dl {
      font-family: monospace;
    }
    video {
      /* height: auto; */
      /* width: 100%; */
      position: absolute;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    button {
      border-style: solid;
      border-width: thick;
      border-top-color: #fafafa;
      border-left-color: #f4f4f4;
      border-bottom-color: #333333;
      border-right-color: #333333;
      background-color: white;
      margin: 0.5em;
      padding: 0.5em;
      font-family: Copperplate;
    }
  </style>
  <body>
    <script type="module" src="RemoteMediaClient.js"></script>
    <script type="module">
      import { RemoteMediaClient } from './RemoteMediaClient.js'
      import { Logger } from './Logger.js'
      window.RemoteMediaClient = RemoteMediaClient
      window.logger = new Logger('UI')
      Logger.setLogStringCallback((string) => {
        const newLogEntryElement = document.createElement('dt')
        newLogEntryElement.textContent = string
        document.getElementById('log').appendChild(newLogEntryElement)
      })
      window.remoteMediaClient = new RemoteMediaClient(btoa(Math.random().toString().slice(10)), 'www.soundetch.org')

      const roomId = new URLSearchParams(window.location.search).get('room')
      if (roomId != null) {
        window.remoteMediaClient.joinRoom(roomId)
      } else {
        window.remoteMediaClient.takeRoom()
      }

      window.remoteMediaClient.addChatMessageListener((message) => {
        const e = document.createElement('p')
        e.textContent = `${message.username}: ${message.text}`
        document.getElementById('chat').appendChild(e)
      })
      window.remoteMediaClient.addStateListener((state) => {
        window.logger.log(JSON.stringify(state))
        const vidsParentElement = document.getElementById('vids')
        const elementIds = []
        state.members.forEach((member) => {
          const elementId = member.username + (state.isScreenShare ? '_share' : '_vid')
          elementIds.push(elementId)
          const element = document.getElementById(elementId)

          if (!element) {
            const vidDiv = document.createElement('div')
            vidDiv.setAttribute('class', 'vidDiv')
            vidDiv.setAttribute('onclick', `spotlightElement('${elementId}')`)
            vidDiv.id = elementId
            vidsParentElement.appendChild(vidDiv)

            const newElement = document.createElement('video')
            newElement.srcObject = member.mediaStream
            // mirror your own video feed
            if (member.isSelf && !member.isScreenShare) {
              newElement.style.transform = 'scale(-1,1)'
            }
            vidDiv.appendChild(newElement)
            newElement.onloadedmetadata = () => {
              newElement.play()
            }
          }
        })
        for (let i = 0; i < vidsParentElement.children.length; ++i) {
          const node = vidsParentElement.children[i]
          if (!elementIds.includes(node.id)) {
            window.logger.log('oh dear ;()' + node.id + ' ' + JSON.stringify(elementIds))
            node.remove()
          }
        }
        applyVideoLayout()
      })
      setUpKeyListener()
      window.videoLayout = 'grid'
      window.centralVideoIndex = 0
      applyVideoLayout()
      // for await (let message of window.remoteMediaClient.getNextChatLogMessage()) {
      //     const e = document.createElement('p')
      //     e.textContent = `${message.username}: ${message.text}`
      //     document.getElementById('chat').appendChild(e)
      // }
    </script>
    <script>
      function setUpKeyListener() {
        const keysDown = {}
        document.onkeydown = (e) => {
          keysDown[e.keyCode] = true
          if (keysDown[17] && keysDown[192]) {
            const chatLogElement = document.getElementById('log')
            const newDisplayState = chatLogElement.style.display == 'none' ? 'block' : 'none'
            chatLogElement.style.display = newDisplayState
          }
        }
        document.onkeyup = (e) => {
          delete keysDown[e.keyCode]
        }
      }
      function onChatInputKeyDown() {
        if (event.keyCode == 13) {
          const inputElement = document.getElementById('chatInput')
          window.remoteMediaClient.sendChatToPeers(inputElement.value)
          inputElement.value = ''
        }
      }
      function onStartSharingScreen() {
        window.remoteMediaClient.startSharingScreen()
      }
      function onStartSharingAudioAndVideo() {
        window.remoteMediaClient.startSharingAudioAndVideo()
      }
      function toggleVidLayoutChange() {
        switch (window.videoLayout) {
          case 'grid':
            window.videoLayout = 'spotlight'
            break
          case 'spotlight':
            window.videoLayout = 'solo'
            break
          case 'solo':
            window.videoLayout = 'grid'
            break
        }
        applyVideoLayout()
      }
      function applyVideoLayout() {
        const vidsParentElement = document.getElementById('vids')
        switch (window.videoLayout) {
          case 'spotlight':
            for (let i = 0; i < vidsParentElement.children.length; ++i) {
              const element = vidsParentElement.children.item(i)
              if (i == window.centralVideoIndex) {
                element.style.setProperty('height', '70%')
                element.style.setProperty('flex', '100%')
                element.style.removeProperty('max-width')
              } else {
                element.style.setProperty('flex', '1%')
                element.style.setProperty('height', '30%')
                element.style.removeProperty('max-width')
              }
            }
            break
          case 'solo':
            for (let i = 0; i < vidsParentElement.children.length; ++i) {
              const element = vidsParentElement.children.item(i)
              if (i == window.centralVideoIndex) {
                element.style.removeProperty('height')
                element.style.setProperty('flex', '1')
                element.style.removeProperty('max-width')
              } else {
                element.style.removeProperty('height')
                element.style.setProperty('flex', '0')
                element.style.removeProperty('max-width')
              }
            }
            break
          case 'grid':
            const newFlex = vidsParentElement.children.length < 3 ? '100%' : '50%'
            for (let i = 0; i < vidsParentElement.children.length; ++i) {
              const child = vidsParentElement.children.item(i)
              child.style.setProperty('height', newFlex)
              child.style.setProperty('flex', '50%')
              child.style.setProperty('max-width', '50%')
            }
            break
        }
      }
      function spotlightElement(id) {
        const vidsParentElement = document.getElementById('vids')
        const newChildren = []
        for (let i = 0; i < vidsParentElement.children.length; ++i) {
          if (vidsParentElement.children.item(i).id == id) {
            newChildren.push(vidsParentElement.children.item(0))
            newChildren.unshift(vidsParentElement.children.item(i))
          } else if (i > 0) {
            newChildren.push(vidsParentElement.children.item(i))
          }
        }
        vidsParentElement.replaceChildren(...newChildren)
        applyVideoLayout()
      }
    </script>
    <div style="display: flex; flex-direction: column; height: 100%">
      <div class="inset" style="height: 5%">
        <h2 style="display: inline; padding: 1em">SoundEtch ;)</h2>
        <button type="button" onclick="onStartSharingScreen()">
          <img src="screenshare.svg" class="icon" />
        </button>
        <button type="button" onclick="onStartSharingAudioAndVideo()">
          <img src="camera.svg" class="icon" />
        </button>
        <button type="button" onclick="toggleVidLayoutChange()">Change video layout</button>
        <input type="text" id="chatInput" onkeydown="onChatInputKeyDown()" />
        <div id="chat"></div>
      </div>
      <div id="vids" class="inset" style="flex: 1; display: flex; flex-wrap: wrap"></div>
      <dl id="log" class="inset" style="overflow-y: auto; height: 25%; display: block"></dl>
    </div>
  </body>
</html>
