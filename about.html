    <p>
      The De-esser, Limiter, and Gate effects are adapted from
      <a href="https://github.com/audiojs/dynamics">AudioJS Dynamics</a>, MIT-licensed software by Dmitry Iv.
      <a href="THIRD_PARTY_NOTICES.txt">Third-party notices.</a>
    </p>
    <p>
      SoundEtch also relies on <a href="https://ko-fi.com/tf3rdl">TF3RDL</a> for spectrum analysis,
      <a href="https://github.com/Rikorose/DeepFilterNet">DeepFilterNet</a> for noise reduction,
      <a href="https://mediabunny.dev/">MediaBunny</a> for media processing, and
      <a href="https://peerjs.com/">PeerJS</a> for peer-to-peer connectivity.
