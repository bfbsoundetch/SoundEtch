name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes checks still running for the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Fix failures locally with `yarn prettier`.
      - name: Check formatting
        run: yarn prettier:check

  unit:
    name: Type-check and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: yarn
      # The encoder round-trip tests decode exports with ffmpeg and ffprobe, and skip without them.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: yarn install --frozen-lockfile
      - name: Type-check
        run: yarn tsc --noEmit
      - name: Unit tests
        run: yarn test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Install Chromium
        run: yarn playwright install --with-deps chromium
      - name: End-to-end tests
        run: yarn test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
